services:
  postgres:
    image: postgres:18-alpine
    container_name: solux-chat-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solux_chat
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d solux_chat']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
